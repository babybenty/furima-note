# Google Play 提出用の AAB を作る。
# 必要な Secrets（Settings → Secrets and variables → Actions）:
#   ANDROID_KEYSTORE_BASE64   アップロード鍵（keystore）を base64 にしたもの
#   ANDROID_KEYSTORE_PASSWORD keystore と鍵のパスワード
name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", "index.html", "app.js", "styles.css", "config.js", "license.js", "scripts/**", "package*.json", "capacitor.config.json"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web assets
        run: npm ci && npm run sync
      - name: Decode upload key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 が未登録のため、動作確認用の APK だけを作ります（STORE.md 参照）。"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed AAB (Google Play 提出用)
        if: steps.key.outputs.signed == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon bundleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            grep -A25 "What went wrong" "$RUNNER_TEMP/gradle.log" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'true'
        with:
          name: furimacho-${{ github.run_number }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Build debug APK (動作確認用)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            # 失敗理由を注釈に出す（ログを開かなくても原因が分かるように）
            grep -A25 "What went wrong" "$RUNNER_TEMP/gradle.log" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: furimacho-${{ github.run_number }}-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
